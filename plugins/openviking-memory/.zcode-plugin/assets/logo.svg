<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7931e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f7931e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Outer ring (Viking shield hint) -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ring)" stroke-width="2"/>

  <!-- Stylized "V" for Viking -->
  <path d="M 30 36 L 64 96 L 98 36 L 82 36 L 64 70 L 46 36 Z"
        fill="url(#v)"
        stroke="#ff6b35"
        stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Small data dots (memory hint) -->
  <circle cx="64" cy="22" r="3" fill="#ff6b35"/>
  <circle cx="44" cy="22" r="2" fill="#f7931e" opacity="0.7"/>
  <circle cx="84" cy="22" r="2" fill="#f7931e" opacity="0.7"/>
</svg>